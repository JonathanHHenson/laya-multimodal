[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "laya-multimodal"
version = "0.1.0"
description = "Fast, calibrated decisions over images and audio without autoregressive decoding"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Jonathan Henson" }]
keywords = ["multimodal", "classification", "siglip2", "clap", "pytorch"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "numpy>=1.26",
  "pillow>=10.0",
  "safetensors>=0.4.5",
  "torch>=2.3",
  "transformers>=4.50",
]

[project.optional-dependencies]
audio = ["soundfile>=0.12", "librosa>=0.10.2"]
train = ["tqdm>=4.66"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.8"]

[project.scripts]
laya-mm = "laya_multimodal.cli:main"

[project.urls]
Repository = "https://github.com/JonathanHHenson/laya-multimodal"

[tool.hatch.build.targets.wheel]
packages = ["src/laya_multimodal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

